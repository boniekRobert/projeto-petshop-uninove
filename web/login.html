<!DOCTYPE html>
<html>
    <head>
        <title>Petshop - Login</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css"/>
    </head>
    <body>
        <form method="post" action="acesso.jsp">
            <h2 style="text-align: center; color: rgba(28, 75, 218, 1); font-family: calibri;">PetShop</h2>
            <p>
                <label>Login:</label>
                <input id="login" type="text" name="login" required>
            </p>
            <p>
                <label>Senha:&nbsp;&nbsp;&nbsp;</label>
                <input id="senha" type="password" name="senha" required>
            </p>
            <p style="text-align: center;">
                <input type="submit" value="Entrar no Sistema">
            </p>
            <p style="text-align: center;">
                <a href="cadastrese.html">Cadastre-se</a>
            </p>
        </form>
    </body>
</html>
